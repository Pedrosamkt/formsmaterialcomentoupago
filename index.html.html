<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #0A0A0A;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .form-wrapper {
    width: 100%;
    max-width: 460px;
  }

  .form-title {
    color: #ffffff;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .form-subtitle {
    color: #C74C28;
    font-size: 14px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 32px;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    color: #C74C28;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background-color: transparent;
    border: none;
    border-bottom: 1px solid #333333;
    color: #ffffff;
    font-size: 16px;
    padding: 10px 4px;
    outline: none;
    transition: border-color 0.3s ease;
  }

  input::placeholder {
    color: #555555;
  }

  input:focus {
    border-bottom-color: #C74C28;
  }

  button {
    width: 100%;
    background-color: #C74C28;
    color: #ffffff;
    border: none;
    padding: 16px;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 12px;
    transition: opacity 0.2s ease;
  }

  button:hover {
    opacity: 0.85;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status-message {
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    display: none;
  }

  .status-message.success {
    color: #4ade80;
    display: block;
  }

  .status-message.error {
    color: #f87171;
    display: block;
  }
</style>
</head>
<body>

  <div class="form-wrapper">
    <div class="form-title">Para receber o relatório , preencha os campos abaixo </div>
 
    <form id="contactForm">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      </div>

      <div class="field">
        <label for="whatsapp">WhatsApp</label>
        <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" required>
      </div>

      <button type="submit" id="submitBtn">Enviar</button>

      <div class="status-message" id="statusMessage"></div>
    </form>
  </div>

  <script>
    // COLE AQUI A URL DO SEU APPS SCRIPT (passo a passo explicado junto)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd_MW1_jwT7dYZhk_1dy8RJCZwdteV_xwtsyThxXgp/dev";

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Enviando...";
      statusMessage.className = "status-message";
      statusMessage.textContent = "";

      const formData = new FormData(form);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData
      })
      .then(response => {
        statusMessage.textContent = "Recebemos seus dados! Em breve entramos em contato.";
        statusMessage.className = "status-message success";
        form.reset();
      })
      .catch(error => {
        statusMessage.textContent = "Ops, algo deu errado. Tenta novamente.";
        statusMessage.className = "status-message error";
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Enviar";
      });
    });
  </script>

</body>
</html>
